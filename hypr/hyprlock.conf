
animations {
    enabled = false
}


background {
     path = ~/Pictures/wallpapers/w1.jpg
    blur_passes = 2
    blur_size = 1
}



label {
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgba(ffffffaa)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 780
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$TIME"
    color = rgba(dddddd70)
    font_size = 150
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 660
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

image {
    path = ~/.config/fastfetch/kangie.png  # Pas dit pad aan naar jouw afbeelding
    size = 100
    border_size = 0
    rounding = -1 # Maakt de afbeelding een cirkel
    position = 0, -700
    halign = center
    valign = center
}

input-field {
    size = 200, 45
    outline_thickness = 0
    dots_size = 0.3
    dots_space = 0.5
    dots_center = true
    inner_color = rgba(dddddd50)
    font_color = rgb(ffffff)
    hide_input = false
    rounding = -1
    placeholder_text = <span></span>
    fade_on_empty = false
    fade_timeout = 0
    check_color = rgb(255, 97, 97)
    fail_color = rgb(255, 97, 97)
    fail_transition = 300
    position = 0, -800
    halign = center
    valign = center
}

label {
    text = Enter Password
    color = rgba(ffffffaa)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -850
    halign = center
    valign = center
}
